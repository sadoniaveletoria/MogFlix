name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Build
        run: dotnet build -c Release

      - name: Locate packaged zip
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) {
            Write-Error "No packaged zip found under bin/ - check DalamudPackager output."
            exit 1
          }
          Copy-Item $zip.FullName -Destination "MogFlix.zip"
          echo "zip_path=MogFlix.zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.zip_path }}
          generate_release_notes: true
