name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/**"
      - "repo.json"
      - "images/**"
  workflow_dispatch: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed so the tag action can see existing tags

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: "v"
          DEFAULT_BUMP: patch

  build:
    needs: tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Build
        run: dotnet build -c Release

      - name: Locate packaged zip
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) {
            Write-Error "No packaged zip found under bin/ - check DalamudPackager output."
            exit 1
          }
          Copy-Item $zip.FullName -Destination "MogFlix.zip"
          echo "zip_path=MogFlix.zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          files: ${{ steps.locate.outputs.zip_path }}
          generate_release_notes: true
