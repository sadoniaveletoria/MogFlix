name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/use for this release (e.g. v0.1.0)"
        required: true
        default: "v0.0.1-test"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Build
        run: dotnet build -c Release

      - name: Locate packaged zip
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) {
            Write-Error "No packaged zip found under bin/ - check DalamudPackager output."
            exit 1
          }
          Copy-Item $zip.FullName -Destination "MogFlix.zip"
          echo "zip_path=MogFlix.zip" >> $env:GITHUB_OUTPUT

      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "tag_name=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: ${{ steps.locate.outputs.zip_path }}
          generate_release_notes: true
