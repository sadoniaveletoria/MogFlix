name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/**"
      - "repo.json"
      - "images/**"
  workflow_dispatch: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed so the tag action can see existing tags

      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: "v"
          DEFAULT_BUMP: patch

  build:
    needs: tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ needs.tag.outputs.new_tag }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build -c Release -p:AssemblyVersion=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.version }} -p:Version=${{ steps.version.outputs.version }}

      - name: Locate packaged zip
        id: locate
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) {
            Write-Error "No packaged zip found under bin/ - check DalamudPackager output."
            exit 1
          }
          Copy-Item $zip.FullName -Destination "MogFlix.zip"
          echo "zip_path=MogFlix.zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          files: ${{ steps.locate.outputs.zip_path }}
          generate_release_notes: true

      - name: Update repo.json version
        shell: pwsh
        run: |
          $json = @(Get-Content repo.json -Raw | ConvertFrom-Json)
          $json[0].AssemblyVersion = "${{ steps.version.outputs.version }}.0"
          ($json | ConvertTo-Json -Depth 5 -AsArray) | Set-Content repo.json -Encoding utf8

      - name: Commit repo.json version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "repo.json already up to date, nothing to commit."
          } else {
            git commit -m "Update repo.json version to ${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:main
          }
